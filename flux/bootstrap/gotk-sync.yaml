# Applied once during `flux bootstrap github` — reconciles the flux/ subtree itself.
# After bootstrap, Flux manages its own config from Git.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m
  ref:
    branch: main
  secretRef:
    name: flux-system   # deploy key created by flux bootstrap
  url: https://github.com/Len0608/universal-agent-self-service.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m
  path: ./gitops/flux
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
