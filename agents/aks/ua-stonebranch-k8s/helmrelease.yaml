apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ua-stonebranch-k8s
  namespace: sb-ua-stonebranch-k8s
spec:
  interval: 10m
  chart:
    spec:
      chart: helm-repo/helm/helm_ua_v1.5.1-aks
      sourceRef:
        kind: GitRepository
        name: helm-charts
        namespace: flux-system
      interval: 1m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  # Base defaults applied first, then agent-specific overrides below
  valuesFrom:
    - kind: ConfigMap
      name: aks-base-values
      namespace: flux-system
      optional: false
  values:
    uaDeployment:
      image:
        tag: "7.9.0.0"
    uaConfig:
      netname: "UA-STONEBRANCH-K8S"
      omsServers: "7878@ps2.stonebranchdev.cloud"
    workloadIdentity:
      enabled: false
    istio:
      host: "ua-stonebranch-k8s.stonebranchdev.cloud"
